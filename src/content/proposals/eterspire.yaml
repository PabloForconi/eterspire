sections:
  - type: text
    eyebrow: La alianza
    nav: Alianza
    id: alianza
    title: Una alianza pensada alrededor de Eterspire
    body: |
      Eterspire es un videojuego independiente argentino que logró construir una comunidad internacional alrededor de una propuesta propia dentro del género MMORPG. Detrás del juego está Stonehollow Workshop, un estudio que lleva adelante el desafío de desarrollar, actualizar y hacer crecer un mundo online desde Argentina para jugadores de distintas partes del mundo.

      Desde Press Over queremos acompañar esa evolución con una colaboración que combine comunicación, generación de comunidad y presencia dentro de la industria local. La propuesta está pensada para darle mayor visibilidad a Eterspire en Argentina y Latinoamérica, acercarlo a nuevos jugadores y mantener el vínculo con quienes ya forman parte de su universo.

      Al mismo tiempo, queremos poner en valor el recorrido de Stonehollow Workshop y generar espacios para que el equipo comparta su experiencia con desarrolladores, estudiantes y profesionales de la industria.

      La alianza se desarrollará en dos espacios complementarios: una campaña sostenida en los canales de Press Over y la participación de Eterspire como Main Sponsor de Indie Dev Argentina 2027 (IDA).

  - type: cards
    eyebrow: Objetivos
    nav: Objetivos
    title: Qué buscamos construir juntos
    columns: 3
    items:
      - title: Más jugadores descubriendo Eterspire
        body: Acercar el juego a nuevas audiencias de Argentina y Latinoamérica mediante contenidos audiovisuales, novedades y presencia recurrente en los canales de Press Over.
      - title: Una comunidad más conectada
        body: Generar oportunidades para que nuestra audiencia conozca el MMORPG, lo pruebe y encuentre motivos para sumarse a su comunidad. Los beneficios, códigos y acciones especiales permitirán convertir la difusión en experiencias concretas para los jugadores.
      - title: Más visibilidad para Stonehollow Workshop
        body: Compartir la historia y la experiencia del equipo detrás de Eterspire, mostrando el trabajo que implica desarrollar y sostener un videojuego independiente con alcance internacional.

  - type: cards
    eyebrow: Comunicación
    nav: Comunicación
    id: comunicacion
    title: Eterspire en Press Over
    intro: Durante el período de colaboración, Eterspire tendrá presencia en distintos espacios de Press Over. La estrategia combinará exposición audiovisual, difusión de novedades y presencia permanente en nuestra web para mantener el juego dentro de la conversación de la comunidad.
    columns: 3
    items:
      - title: Eterspire en vivo
        body: El tráiler oficial de Eterspire se incorporará a las transmisiones de Press Over en YouTube para presentar el juego a nuestra audiencia y generar nuevas oportunidades de descubrimiento.
        items:
          - Entre 3 y 4 reproducciones mensuales del tráiler en los streams de Press Over.
          - Posibilidad de acompañar las reproducciones con menciones de los conductores y comentarios sobre las características del juego.
      - title: Las novedades de Eterspire en Press Over
        body: Acompañaremos los anuncios y momentos relevantes del juego con publicaciones en pressover.news y difusión en nuestros espacios de comunicación.
        items:
          - Publicación de novedades sobre actualizaciones, eventos y anuncios relevantes de Eterspire.
          - Publicación de gacetillas oficiales proporcionadas por Stonehollow Workshop.
          - Difusión de novedades seleccionadas en Press Over Podcast, de acuerdo con la temática y la agenda del programa.
      - title: Eterspire, presente en nuestra web
        body: Eterspire contará con un banner publicitario dentro de la sección de notas de pressover.news, manteniendo su presencia frente a los lectores que siguen las noticias, análisis y novedades de la industria de los videojuegos. El banner estará publicado durante todo el período contratado.

  - type: table
    sub: true
    title: Resumen de presencia en Press Over
    columns: [Acción, Frecuencia / modalidad]
    rows:
      - [Tráiler en streams de YouTube, 3 a 4 reproducciones mensuales]
      - [Novedades en la web, Según anuncios y calendario de comunicación]
      - [Gacetillas oficiales, Según material e información recibida]
      - [Menciones en Press Over Podcast, Según relevancia y programación]
      - [Banner en pressover.news, Durante todo el período contratado]
    notes: Las publicaciones editoriales estarán sujetas a la disponibilidad de información y al criterio periodístico de Press Over.

  - type: text
    eyebrow: Press Over Club
    nav: Press Over Club
    id: press-over-club
    title: Una comunidad alrededor de Eterspire
    body: |
      Queremos que la colaboración no se limite a mostrar el juego: también buscamos generar motivos para que nuestra comunidad se acerque a Eterspire y participe de su universo.

      A través de Press Over Club, proponemos desarrollar beneficios y acciones especiales para nuestros suscriptores, coordinados con el equipo de Stonehollow Workshop.

  - type: cards
    sub: true
    title: Beneficios para los miembros de Press Over Club
    columns: 4
    items:
      - title: Códigos exclusivos
        body: Códigos promocionales para que los miembros de Press Over Club puedan acceder a beneficios dentro de Eterspire.
      - title: Recompensas dentro del juego
        body: Objetos, ventajas u otras recompensas especiales, de acuerdo con las posibilidades que ofrezca el juego.
      - title: Sorteos para la comunidad
        body: Sorteos de códigos o recompensas de Eterspire a través de los canales de Press Over.
      - title: Acciones especiales
        body: Dinámicas puntuales para incentivar la participación, dar a conocer el juego y conectar ambas comunidades.
    notes: La disponibilidad, las características y las condiciones de estos beneficios se definirán junto al equipo de Eterspire.

  - type: text
    eyebrow: Indie Dev Argentina 2027 (IDA)
    nav: IDA 2027
    id: ida-2027
    tone: dark
    logo: ../../assets/brand/ida-logo-white.png
    title: Eterspire en Indie Dev Argentina 2027
    body: |
      Eterspire ya demostró su compromiso con el desarrollo de videojuegos en Argentina al participar como Main Sponsor de EVA en sus ediciones 2025 y 2026. Desde Press Over queremos invitarlos a continuar ese recorrido en Indie Dev Argentina 2027 (IDA), nuestro encuentro anual dedicado al desarrollo independiente.

      IDA reúne a desarrolladores, estudios, profesionales, estudiantes y entusiastas de la industria. Es el segundo evento de mayor escala del país dentro de este segmento y un espacio para conocer proyectos, compartir experiencias y generar vínculos dentro del ecosistema local.

      Proponemos que Eterspire participe como Main Sponsor de IDA 2027, con una presencia destacada en la comunicación del evento y una participación activa de Stonehollow Workshop. La propuesta busca que el juego pueda ser conocido y probado por los asistentes, y que el equipo tenga un espacio para compartir su recorrido y experiencia.

  - type: cards
    sub: true
    title: La participación de Eterspire como Main Sponsor incluye
    columns: 2
    items:
      - title: IDA 2027 presentado por Eterspire
        body: Eterspire estará asociado a la identidad institucional del encuentro bajo la denominación «IDA 2027 presentado por Eterspire», con presencia de marca en la comunicación oficial y en las principales piezas de difusión del evento.
      - title: Una charla de Stonehollow Workshop
        body: El equipo contará con un espacio asegurado dentro de la programación oficial para presentar su experiencia en el desarrollo de Eterspire. La charla podrá abordar el proceso de creación y evolución del MMORPG, los desafíos de desarrollar y mantener un juego online independiente, la construcción de una comunidad internacional y el trabajo de desarrollar videojuegos desde Argentina para el mundo. La temática y los participantes se coordinarán con la organización de IDA.
      - title: Un espacio para mostrar y probar Eterspire
        body: Eterspire contará con un espacio de exhibición para acercar el juego a los asistentes. Podrá incluir estaciones para jugar, exhibición de videos y material audiovisual, recursos promocionales, códigos de beneficios e interacción directa con integrantes del equipo de desarrollo. La configuración final se coordinará de acuerdo con las necesidades técnicas y logísticas.
      - title: Un premio presentado por Eterspire
        body: Eterspire presentará uno de los premios de IDA 2027, vinculando su participación con el reconocimiento al talento y la creatividad de los desarrolladores independientes. La categoría, modalidad y características del premio se definirán junto a la organización.

  - type: text
    eyebrow: Propuesta económica
    nav: Inversión
    id: inversion
    title: La inversión
    body: |
      La alianza contempla dos componentes: la comunicación de Eterspire durante el período contratado con Press Over y su participación como Main Sponsor de IDA 2027. La contratación conjunta permite acceder a un valor preferencial para el patrocinio del evento.

  - type: pricing
    sub: true
    title: Comunicación de Eterspire en Press Over
    packages:
      - { name: Anual, price: ARS 10.000.000, period: 12 meses }
      - { name: Semestral, price: ARS 5.000.000, period: 6 meses }
      - { name: Mensual, price: ARS 1.000.000, period: 1 mes }
    notes: Los planes anual y semestral pueden abonarse mediante pagos mensuales durante el período contratado.

  - type: table
    sub: true
    title: Eterspire como Main Sponsor de IDA 2027
    intro: |
      El valor de referencia del patrocinio Main Sponsor es de **USD 5.000**. Al contratar simultáneamente un plan de comunicación con Press Over, Eterspire accede a las siguientes condiciones preferenciales:
    columns: [Contratación de Press Over, Inversión Main Sponsor IDA 2027]
    align: [left, right]
    rows:
      - [Sin plan de comunicación, USD 5.000]
      - [Plan semestral · 6 meses, USD 4.000]
      - [Plan anual · 12 meses, USD 3.000]
    notes: Con el plan semestral, el beneficio representa un ahorro de USD 1.000 sobre el valor de referencia. Con el plan anual, el ahorro es de USD 2.000.

  - type: text
    sub: true
    title: Un mes para comenzar antes
    callout: true
    body: Si la colaboración comienza en diciembre de 2026, ese mes de comunicación en Press Over será bonificado. Así, Eterspire podrá iniciar su presencia en nuestros canales antes del período regular de contratación, sin costo adicional por diciembre.

  - type: cards
    sub: true
    title: Condiciones comerciales
    columns: 2
    items:
      - title: Pagos de Press Over
        body: Los planes anual y semestral de comunicación podrán abonarse mediante transferencia bancaria en cuotas mensuales durante el período contratado. El plan mensual se abonará por el período correspondiente.
      - title: Pago del patrocinio IDA 2027
        body: La inversión correspondiente al patrocinio Main Sponsor de IDA 2027 se realizará mediante un único pago, una vez confirmada la participación de Eterspire.
      - title: Facturación
        body: Press Over podrá emitir factura tipo A para operaciones dentro de Argentina y factura tipo E para operaciones con clientes del exterior. Los importes expresados en pesos argentinos y dólares estadounidenses corresponden a los servicios indicados en cada apartado.
      - title: Contratación conjunta
        body: Los valores preferenciales de Main Sponsor de USD 4.000 y USD 3.000 corresponden, respectivamente, a la contratación simultánea de los planes semestral y anual de Press Over.

  - type: cards
    eyebrow: Coordinación
    nav: Coordinación
    id: coordinacion
    title: Coordinación de la colaboración
    intro: Para poner en marcha las acciones, Press Over y Stonehollow Workshop coordinarán un calendario de comunicación y la entrega de materiales necesarios para cada canal.
    columns: 3
    items:
      - title: Materiales para la comunicación
        items:
          - Tráiler oficial de Eterspire en alta calidad.
          - Logos y recursos gráficos oficiales.
          - Imágenes y capturas actualizadas del juego.
          - Información sobre actualizaciones, eventos y anuncios.
          - Enlaces oficiales de descarga y canales de comunidad.
      - title: Beneficios de Press Over Club
        items:
          - Códigos promocionales o beneficios disponibles para los suscriptores.
          - Detalle de las recompensas y condiciones de uso.
      - title: Participación en IDA 2027
        items:
          - Material audiovisual para la exhibición.
          - Disponibilidad de integrantes de Stonehollow Workshop para la charla.
          - Definición del premio que presentará Eterspire.
          - Coordinación de los requerimientos técnicos y logísticos del espacio.
    notes: Press Over estará a cargo de coordinar las publicaciones y acciones incluidas en esta propuesta, así como los detalles de participación en IDA 2027. Stonehollow Workshop facilitará los materiales y la información oficial necesarios para su implementación.

  - type: contact
    eyebrow: Conclusión
    nav: Conclusión
    id: conclusion
    title: Sigamos haciendo crecer Eterspire
    body: |
      Eterspire es un proyecto argentino con una comunidad que ya trascendió sus fronteras. Desde Press Over queremos contribuir a su crecimiento en Latinoamérica, acercándolo a nuevos jugadores y generando más oportunidades para que su historia y la experiencia de Stonehollow Workshop lleguen a la comunidad de videojuegos.

      Creemos que esta colaboración puede construir un vínculo valioso entre el juego, sus jugadores y el ecosistema de desarrollo independiente. Nos gustaría que Eterspire forme parte de Press Over y que Stonehollow Workshop sea protagonista de Indie Dev Argentina 2027.
    contacts:
      - { name: Pablo Forconi, role: Director Ejecutivo, whatsapp: "+54 9 11 2296 0576", email: ventas.pressover@gmail.com }
      - { name: Juan Lomanto, role: Director General, whatsapp: "+54 9 11 6869 5860", email: info@pressovernews.com }
