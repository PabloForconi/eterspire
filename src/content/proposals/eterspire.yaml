sections:
  - type: text
    eyebrow: La alianza
    nav: Alianza
    id: alianza
    title: Una alianza pensada alrededor de Eterspire
    body: |
      Eterspire es un proyecto que representa **el potencial de los videojuegos independientes argentinos**. A través de una propuesta propia dentro del género MMORPG, ha conseguido desarrollar **una comunidad internacional** y construir una identidad dentro de un mercado altamente competitivo.

      Desde Press Over queremos acompañar ese crecimiento mediante una alianza que permita **ampliar su presencia en Latinoamérica**, **acercar el juego a nuevos públicos** y **fortalecer el vínculo con su comunidad de jugadores**.

      Al mismo tiempo, nos interesa darle visibilidad a **la historia detrás del proyecto y al trabajo de Stonehollow Workshop**, poniendo en valor el talento y la capacidad de los estudios argentinos para desarrollar videojuegos con proyección internacional.

      Para eso, proponemos una colaboración que integre dos dimensiones: **una presencia sostenida** a través de los diferentes canales de Press Over y **una participación destacada en Indie Dev Argentina 2027 (IDA)**, nuestro encuentro anual dedicado al desarrollo independiente de videojuegos.

      Buscamos construir **una relación que genere valor para ambas partes**: potenciando el crecimiento de Eterspire y contribuyendo a visibilizar el desarrollo de videojuegos argentino dentro de la comunidad regional.

  - type: cards
    eyebrow: Objetivos
    nav: Objetivos
    title: Qué buscamos construir juntos
    intro: La alianza entre Eterspire y Press Over busca desarrollar una propuesta de difusión y presencia que permita aprovechar los distintos espacios de contacto con la comunidad gamer y el ecosistema de desarrollo de videojuegos.
    columns: 2
    items:
      - title: Presencia en la comunidad gamer
        body: Consolidar la presencia de Eterspire dentro del mercado gamer argentino y latinoamericano, aprovechando la llegada y credibilidad de Press Over como medio especializado en videojuegos.
      - title: Alcance y adquisición de nuevos jugadores
        body: Ampliar el conocimiento del juego entre nuevas audiencias, destacando sus características, novedades y propuesta de juego. Generar oportunidades para que más personas descubran Eterspire, lo prueben y se incorporen a su comunidad.
      - title: Fidelización y participación de la comunidad
        body: Fortalecer el vínculo con los jugadores actuales y potenciales mediante contenidos recurrentes, beneficios exclusivos, códigos promocionales y acciones especiales a través de Press Over Club.
      - title: Visibilidad dentro de la industria del videojuego
        body: Destacar a Eterspire y Stonehollow Workshop como referentes del desarrollo independiente argentino, generando espacios para compartir su experiencia, mostrar el proyecto y conectar con otros integrantes de la industria a través de Indie Dev Argentina 2027.

  - type: cards
    eyebrow: Difusión
    nav: Difusión
    id: difusion
    title: Eterspire en Press Over
    intro: Durante el período de colaboración, Eterspire tendrá presencia en distintos espacios de Press Over. La propuesta combina contenidos audiovisuales, cobertura de novedades, difusión a través de nuestra newsletter y presencia publicitaria en la web, con el objetivo de mantener el juego dentro de la conversación de nuestra comunidad.
    columns: 2
    items:
      - tag: 01 · YouTube
        title: Presencia en nuestros programas
        body: "Integraremos videos oficiales de Eterspire, como tráileres, teasers o gameplay, en nuestros dos espacios audiovisuales de YouTube: Press Over Podcast y Stream Over, acercando el juego a nuestra audiencia a través de contenidos y transmisiones."
        items:
          - Entre 10 y 12 reproducciones mensuales de videos de Eterspire en nuestros programas.
          - Posibilidad de acompañar las reproducciones con menciones de los conductores y comentarios sobre las características del juego.
      - tag: 02 · Website
        title: Notas y novedades
        body: Acompañaremos los anuncios y momentos relevantes del juego con artículos y publicaciones en pressover.news, acercando sus novedades a nuestra audiencia.
        items:
          - Publicación de notas sobre actualizaciones, eventos, lanzamientos y anuncios relevantes.
          - Contenidos vinculados con la evolución del juego y las novedades de Stonehollow Workshop.
      - tag: 03 · Newsletter
        title: Comunicación semanal
        body: Eterspire podrá integrar la newsletter semanal de Press Over, que reúne una selección de las noticias más destacadas de la industria y funciona como una vía adicional para acercar los contenidos publicados en pressover.news a nuestros lectores.
        items:
          - Inclusión de novedades y anuncios relevantes entre los contenidos destacados.
          - Difusión semanal por correo electrónico a una base de 988 suscriptores activos, con una tasa de apertura del 33% y un crecimiento superior al 70% anual (datos de 2025).
      - tag: 04 · Banner
        title: Presencia publicitaria en nuestra web
        body: Eterspire contará con un banner publicitario dentro de la sección de notas de pressover.news, manteniendo su presencia frente a los lectores que siguen las noticias, análisis y novedades de la industria de los videojuegos.
        items:
          - Banner publicado durante todo el período contratado.
    notes: Además, la mayoría de estos contenidos se difunden a través de las redes sociales de Press Over (X, Instagram y TikTok), ampliando su alcance más allá de nuestros canales principales.

  - type: table
    sub: true
    title: Resumen de presencia en Press Over
    columns: [Acción, Frecuencia / modalidad]
    rows:
      - [Video en Press Over Podcast y Stream Over, "10 a 12 reproducciones mensuales, con posibles menciones de los conductores"]
      - [Notas y novedades en pressover.news, "Según actualizaciones, eventos, lanzamientos y anuncios"]
      - [Newsletter semanal, "Semanal, cuando haya novedades relevantes"]
      - [Banner en pressover.news, Durante todo el período contratado]
      - ["Difusión en redes sociales (X, Instagram y TikTok)", Acompañando la publicación de los contenidos]
    notes: Las publicaciones editoriales estarán sujetas a la disponibilidad de información y al criterio periodístico de Press Over.

  - type: cards
    eyebrow: Press Over Club
    nav: Press Over Club
    id: press-over-club
    title: Una comunidad alrededor de Eterspire
    intro: |
      Como parte de la colaboración, proponemos incorporar a Eterspire dentro de Press Over Club, nuestro espacio de beneficios y ventajas para los miembros de nuestra comunidad.

      La iniciativa busca generar un vínculo directo entre los suscriptores de Press Over y el universo de Eterspire, ofreciendo incentivos para descubrir el juego, participar de sus actividades y sumarse a su comunidad.
    columns: 4
    items:
      - title: Códigos promocionales
        body: Disponibilidad de códigos exclusivos para los miembros de Press Over Club.
      - title: Beneficios dentro del juego
        body: Recompensas, objetos u otras ventajas especiales para quienes formen parte de nuestra comunidad.
      - title: Sorteos especiales
        body: Posibilidad de organizar sorteos de códigos o recompensas de Eterspire a través de nuestros canales.
      - title: Acciones especiales
        body: Dinámicas puntuales para promover la participación de la comunidad y generar nuevas oportunidades de difusión.
    notes: La disponibilidad, las características y las condiciones de estos beneficios se definirán junto al equipo de Eterspire.

  - type: text
    eyebrow: Indie Dev Argentina 2027 (IDA)
    nav: IDA 2027
    id: ida-2027
    tone: dark
    logo: ../../assets/brand/ida-logo-white.png
    title: Eterspire como Main Sponsor del encuentro.
    body: |
      Eterspire ya ha demostrado su compromiso con la industria nacional, participando como Main Sponsor de la EVA y acompañando el crecimiento y la visibilidad del desarrollo de videojuegos en Argentina.

      Desde Press Over queremos invitarlos a continuar ese camino formando parte de Indie Dev Argentina 2027 (IDA), nuestro encuentro anual dedicado al desarrollo independiente de videojuegos y el segundo evento de mayor escala del país dentro de este segmento.

      Organizado por Press Over, IDA reúne a desarrolladores, estudios, profesionales, estudiantes y entusiastas de la industria, generando un espacio de encuentro, intercambio y visibilidad para los proyectos que forman parte del ecosistema local.

      La participación de Eterspire como Main Sponsor representa una oportunidad para seguir fortaleciendo su vínculo con la comunidad de desarrollo, compartir la experiencia de Stonehollow Workshop y acompañar el crecimiento de una industria de la que el propio estudio forma parte.

  - type: cards
    sub: true
    title: La participación de Eterspire como Main Sponsor incluye
    columns: 2
    items:
      - title: IDA 2027 presentado por Eterspire
        body: Eterspire estará asociado a la identidad institucional del encuentro bajo la denominación «IDA 2027 presentado por Eterspire», con presencia de marca en la comunicación oficial y en las principales piezas de difusión del evento.
      - title: Una charla de Stonehollow Workshop
        body: El equipo contará con un espacio asegurado dentro de la programación oficial para presentar su experiencia en el desarrollo de Eterspire. La charla podrá abordar el proceso de creación y evolución del MMORPG, los desafíos de desarrollar y mantener un juego online independiente, la construcción de una comunidad internacional y el trabajo de desarrollar videojuegos desde Argentina para el mundo. La temática y los participantes se coordinarán con la organización de IDA.
      - title: Un espacio para mostrar y probar Eterspire
        body: Eterspire contará con un espacio de exhibición para acercar el juego a los asistentes. Podrá incluir estaciones para jugar, exhibición de videos y material audiovisual, recursos promocionales, códigos de beneficios e interacción directa con integrantes del equipo de desarrollo. La configuración final se coordinará de acuerdo con las necesidades técnicas y logísticas.
      - title: Un premio presentado por Eterspire
        body: Eterspire presentará uno de los premios de IDA 2027, vinculando su participación con el reconocimiento al talento y la creatividad de los desarrolladores independientes. La categoría, modalidad y características del premio se definirán junto a la organización.

  - type: text
    eyebrow: Propuesta económica
    nav: Inversión
    id: inversion
    title: La inversión
    body: |
      La alianza contempla dos componentes: la difusión de Eterspire durante el período contratado con Press Over y su participación como Main Sponsor de IDA 2027. La contratación conjunta permite acceder a un valor preferencial para el patrocinio del evento.

  - type: pricing
    sub: true
    title: Difusión de Eterspire en Press Over
    packages:
      - { name: Anual, price: ARS 10.000.000, period: 12 meses }
      - { name: Semestral, price: ARS 5.000.000, period: 6 meses }
      - { name: Mensual, price: ARS 1.000.000, period: 1 mes }
    notes: Los planes anual y semestral pueden abonarse mediante pagos mensuales durante el período contratado.

  - type: table
    sub: true
    title: Eterspire como Main Sponsor de IDA 2027
    intro: |
      El valor de referencia del patrocinio Main Sponsor es de **USD 5.000**. Al contratar simultáneamente un plan de difusión con Press Over, Eterspire accede a las siguientes condiciones preferenciales:
    columns: [Contratación de Press Over, "Main Sponsor\nIDA 2027"]   # \n = line break on phones
    align: [left, right]
    rows:
      - [Sin plan de difusión, USD 5.000]
      - [Plan semestral · 6 meses, USD 4.000]
      - [Plan anual · 12 meses, USD 3.000]
    notes: Con el plan semestral, el beneficio representa un ahorro de USD 1.000 sobre el valor de referencia. Con el plan anual, el ahorro es de USD 2.000.

  - type: text
    sub: true
    title: Un mes para comenzar antes
    callout: true
    body: Si la colaboración comienza en diciembre de 2026, ese mes de presencia en Press Over será bonificado. Así, Eterspire podrá iniciar su presencia en nuestros canales antes del período regular de contratación, sin costo adicional por diciembre.

  - type: text
    sub: true
    fine: true
    title: Métodos de pago y facturación
    body: |
      Las condiciones y modalidades de pago se acordarán entre ambas partes, contemplando la posibilidad de realizar pagos mensuales o en cuotas, de acuerdo con las preferencias y posibilidades de la contratación.

      Se podrán emitir facturas tipo A para operaciones dentro de Argentina y tipo E para operaciones con clientes del exterior.

  - type: cards
    eyebrow: Requisitos
    nav: Requisitos
    id: requisitos
    title: Requisitos y coordinación de la colaboración
    intro: Para implementar las acciones propuestas, necesitaremos contar con algunos materiales e información por parte de Eterspire.
    columns: 3
    items:
      - title: Materiales de difusión
        items:
          - Videos oficiales del juego (tráiler, teaser o gameplay) en alta calidad.
          - Logos y recursos gráficos de Eterspire.
          - Imágenes y capturas del videojuego.
          - Información sobre actualizaciones, novedades y anuncios.
          - Enlaces oficiales de descarga y canales de la comunidad.
      - title: Materiales para Press Over Club
        items:
          - Códigos promocionales o beneficios exclusivos para los suscriptores.
          - Información sobre las recompensas disponibles y sus condiciones de uso.
      - title: Participación en IDA 2027
        items:
          - Material audiovisual para la exhibición del juego.
          - Disponibilidad de integrantes de Stonehollow Workshop para la charla.
          - Definición del premio que será presentado por Eterspire.
          - Coordinación de las necesidades técnicas y logísticas del espacio de exhibición.
    notes: Press Over estará a cargo de coordinar las publicaciones y acciones incluidas en esta propuesta, así como los detalles de participación en IDA 2027. Stonehollow Workshop facilitará los materiales y la información oficial necesarios para su implementación.

  - type: contact
    eyebrow: Conclusión
    nav: Conclusión
    id: conclusion
    title: Nuestra visión
    body: |
      Desde Press Over creemos que Eterspire tiene una historia y un proyecto que vale la pena seguir impulsando dentro de la comunidad gamer latinoamericana y del ecosistema de desarrollo independiente.

      Esta propuesta busca construir una colaboración a largo plazo que combine difusión, presencia y participación activa en la industria, generando valor tanto para Eterspire como para nuestra comunidad.

      Esperamos poder acompañar el crecimiento del proyecto y contar con Eterspire como parte de Press Over y de Indie Dev Argentina 2027.
    contacts:
      - { name: Pablo Forconi, role: Director Ejecutivo, whatsapp: "+54 9 11 2296 0576", email: ventas.pressover@gmail.com }
      - { name: Juan Lomanto, role: Director General, whatsapp: "+54 9 11 6869 5860", email: info@pressovernews.com }
